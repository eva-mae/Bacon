<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bacon">
<meta name="theme-color" content="#1C1815">
<title>Bacon</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --parchment:#1C1815; --card:#26221C; --ink:#F5EFE3; --ink-soft:#A79C87; --line:#3D362C;
  --sage:#7ED99A; --sage-bg:rgba(126,217,154,0.22);
  --rust:#FF8A5C; --rust-bg:rgba(255,138,92,0.22);
  --gold:#FFC94D; --gold-bg:rgba(255,201,77,0.22);
  --blue:#6FB8FF; --blue-bg:rgba(111,184,255,0.22);
  --brown:#D9A066; --brown-bg:rgba(217,160,102,0.22);
  --olive:#B8D957; --olive-bg:rgba(184,217,87,0.22);
  --terracotta:#FF7A66; --terracotta-bg:rgba(255,122,102,0.22);
  --plum:#C792EA; --plum-bg:rgba(199,146,234,0.22);
  --grey:#B8AF9C; --grey-bg:rgba(184,175,156,0.18);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 100px;}
header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;}
header.top h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;font-weight:600;font-size:34px;margin:0;letter-spacing:.5px;}
header.top .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);}

/* bottom nav */
nav.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1.5px solid var(--ink);
  display:flex;justify-content:space-around;align-items:stretch;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav.bottombar button{
  flex:1;font-family:inherit;background:transparent;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  color:var(--ink-soft);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;
}
nav.bottombar button .ico{font-size:19px;line-height:1;}
nav.bottombar button.active{color:var(--ink);font-weight:700;background:var(--parchment);}

.section-title{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;font-size:22px;margin:0 0 4px;}
.section-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;letter-spacing:.3px;}
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filters button{font-family:inherit;font-size:12px;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:6px 12px;border-radius:20px;cursor:pointer;}
.filters button.active{border-color:var(--ink);color:var(--ink);background:var(--line);font-weight:600;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:3px;position:relative;padding:16px 16px 14px 18px;overflow:hidden;}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tab-color,#888);}
.rcard h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;font-size:19px;margin:0 0 6px;padding-right:4px;}
.meta-row{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;flex-wrap:wrap;}
.pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;font-weight:700;}
.timegauge{display:inline-flex;gap:3px;align-items:center;}
.timegauge .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.timegauge .dot.on{background:var(--ink);}
.servctl{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--parchment);border:1px solid var(--line);border-radius:20px;padding:4px 6px;width:fit-content;}
.servctl button{width:22px;height:22px;border-radius:50%;border:1px solid var(--ink);background:var(--card);color:var(--ink);font-size:14px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0;}
.servctl button:hover{background:var(--ink);color:var(--parchment);}
.servctl .servlabel{font-size:12px;font-weight:600;min-width:76px;text-align:center;}
.servctl .resetlink{font-size:10.5px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;margin-left:2px;}
.rcard .ingr{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:4px;}
.rcard .ingr b{color:var(--ink);}

/* planner */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;}
.day{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px;min-height:150px;display:flex;flex-direction:column;}
.day h4{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;margin:0 0 2px;font-size:17px;}
.day .daytime{font-size:10.5px;color:var(--ink-soft);margin-bottom:10px;letter-spacing:.5px;}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;background:var(--parchment);border-left:4px solid var(--chipcolor,var(--line));border:1px solid var(--line);border-left-width:4px;border-left-color:var(--chipcolor,var(--line));border-radius:3px;padding:5px 8px;margin-bottom:6px;}
.chip .chipname{display:flex;flex-direction:column;}
.chip .chipserv{font-size:10px;color:var(--ink-soft);}
.chip .x{cursor:pointer;color:var(--ink-soft);font-weight:700;padding:0 2px;}
.chip .x:hover{color:var(--rust);}
.addslot{margin-top:auto;font-family:inherit;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);padding:7px;cursor:pointer;border-radius:2px;}
.addslot:hover{border-color:var(--ink);color:var(--ink);}

.overlay{position:fixed;inset:0;background:rgba(46,42,34,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--card);border-radius:4px;max-width:600px;width:100%;max-height:82vh;overflow:auto;padding:20px;}
.modal h3{font-family:"Iowan Old Style",Georgia,serif;font-style:italic;margin-top:0;}
.picklist{display:flex;flex-direction:column;gap:8px;}
.pickitem{border:1px solid var(--line);border-radius:3px;padding:9px 11px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.pickitem .pname{font-weight:600;}
.pickitem .pmeta{color:var(--ink-soft);font-size:11px;}
.pickitem .pright{display:flex;align-items:center;gap:8px;}
.addbtn{font-family:inherit;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;border-radius:2px;}
.addbtn:hover{background:var(--ink);color:var(--parchment);}
.closebtn{margin-top:14px;font-family:inherit;border:1.5px solid var(--ink);background:transparent;padding:7px 14px;cursor:pointer;border-radius:2px;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px;}

/* pantry & grocery colored sections */
.secblock{margin-bottom:18px;border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.sechead{padding:9px 14px;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;font-size:15.5px;font-weight:600;}
.pantrylist{display:flex;flex-direction:column;gap:1px;background:var(--line);}
.prow{background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:9px 14px;font-size:13.5px;gap:10px;flex-wrap:wrap;}
.statusbtns{display:flex;gap:5px;}
.statusbtns button{font-family:inherit;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--line);background:transparent;padding:4px 9px;border-radius:20px;cursor:pointer;color:var(--ink-soft);}
.statusbtns button.have.on{background:var(--sage-bg);border-color:var(--sage);color:var(--sage);font-weight:700;}
.statusbtns button.low.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:700;}
.statusbtns button.need.on{background:var(--rust-bg);border-color:var(--rust);color:var(--rust);font-weight:700;}
.rmx{cursor:pointer;color:var(--ink-soft);font-weight:700;padding:0 4px;}
.rmx:hover{color:var(--rust);}
.addrow{display:flex;gap:8px;margin-top:12px;padding:0 14px 14px;flex-wrap:wrap;}
.addrow input{flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);}
.addrow select{padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:12.5px;background:var(--card);color:var(--ink);}
.addrow button{font-family:inherit;border:1.5px solid var(--ink);background:var(--ink);color:var(--parchment);padding:9px 16px;border-radius:2px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}

.glist{display:flex;flex-direction:column;gap:1px;background:var(--line);}
.grow{background:var(--card);padding:9px 14px;font-size:13.5px;display:flex;align-items:center;gap:10px;}
.grow.done{opacity:.4;text-decoration:line-through;}
.grow .src{color:var(--ink-soft);font-size:11px;margin-left:auto;text-align:right;}
.grow input[type=checkbox]{width:16px;height:16px;accent-color:var(--sage);cursor:pointer;}
.havepanel{margin-top:6px;}
.tag-have{font-size:10px;text-transform:uppercase;letter-spacing:.5px;background:var(--sage-bg);color:var(--sage);padding:2px 7px;border-radius:20px;font-weight:700;}
.empty{color:var(--ink-soft);font-size:13.5px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:4px;}

.cookbookhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.addrecipebtn{font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.addrecipebtn.on{background:var(--ink);color:var(--parchment);}
.recipeform{padding:14px;display:flex;flex-direction:column;gap:10px;}
.recipeform input, .recipeform select, .recipeform textarea{padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);}
.recipeform textarea{resize:vertical;font-family:inherit;}
.recipeformrow{display:flex;gap:8px;flex-wrap:wrap;}
.recipeformrow input{flex:1;min-width:100px;}
.linkfield{display:flex;align-items:center;gap:8px;}
.linkfield input{width:150px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:12px;background:var(--card);color:var(--ink-soft);}
.linkfield input::placeholder{color:var(--ink-soft);opacity:.6;}
.buybtn{font-family:inherit;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border:1.5px solid var(--ink);background:var(--ink);color:var(--parchment);padding:5px 11px;border-radius:20px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.editlink{cursor:pointer;color:var(--ink-soft);font-size:13px;padding:2px 4px;flex-shrink:0;}
.editlink:hover{color:var(--ink);}
.catedit{font-family:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
.authwrap{max-width:380px;margin:80px auto;padding:0 16px;}
.authbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;}
.authbox h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-style:italic;margin:0 0 4px;font-size:24px;}
.authbox p{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;}
.authbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--parchment);color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:10px;box-sizing:border-box;}
.authbtns{display:flex;gap:8px;margin-top:6px;}
.authbtns button{flex:1;font-family:inherit;border:1.5px solid var(--ink);padding:10px;border-radius:20px;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
.authbtns .primarybtn{background:var(--ink);color:var(--parchment);}
.authbtns .secondarybtn{background:transparent;color:var(--ink);}
.autherr{color:var(--rust);font-size:12.5px;margin-top:10px;min-height:16px;}
.signoutbtn{font-family:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:4px 10px;border-radius:20px;cursor:pointer;margin-top:6px;}
</style>
</head>

    <input type="email" id="authemail" placeholder="Email" autocomplete="email">
    <input type="password" id="authpassword" placeholder="Password" autocomplete="current-password">
    <div class="authbtns">
      <button class="primarybtn" id="authsignin">Sign In</button>
      <button class="secondarybtn" id="authsignup">Create Account</button>

</div>

const UNIT_WORDS = ["cups","cup","tbsp","tablespoons","tablespoon","tsp","teaspoons","teaspoon","oz","ounces","ounce",
"lb","lbs","pound","pounds","g","grams","gram","kg","ml","l","liter","liters","can","cans","clove","cloves",
"slice","slices","stick","sticks","pinch","bunch","package","packages","jar","jars"];
function parseIngredientLine(line){
  const trimmed = line.trim();
  if(!trimmed) return null;
  const m = trimmed.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+)\s*(.*)$/);
  if(!m) return {a:null, u:"", n:trimmed};
  let amt = m[1];
  if(amt.includes(" ")){
    const [whole, frac] = amt.split(" ");
    const [num,den] = frac.split("/");
    amt = parseInt(whole,10) + (parseInt(num,10)/parseInt(den,10));
  } else if(amt.includes("/")){
    const [num,den] = amt.split("/");
    amt = parseInt(num,10)/parseInt(den,10);
  } else {
    amt = parseFloat(amt);
  }
  let rest = m[2].trim();
  let unit = "";
  const words = rest.split(/\s+/);
  const firstWord = (words[0]||"").toLowerCase().replace(/[.,]/g,"");
  if(UNIT_WORDS.includes(firstWord)){
    unit = firstWord.replace(/s$/,"")==="cup"?firstWord:firstWord;
    rest = words.slice(1).join(" ");
  }
  return {a:amt, u:unit, n:rest.trim()};
}

function getLink(key){

  if(key.indexOf("extra:")===0){

    return (ex && ex.link) || "";
  }
  return "";
}
function setLink(key, value){
  if(key.indexOf("pantry:")===0){
    const name = key.slice(7);
    if(value) state.itemLinks[name] = value; else delete state.itemLinks[name];
  } else if(key.indexOf("extra:")===0){
    const ex = state.extras.find(e=>e.id===key.slice(6));
    if(ex){ if(value) ex.link = value; else delete ex.link; }
  }
}

function timeTier(total){ return total<=30?1:(total<=90?2:3); }
function timeLabel(total){ const t=timeTier(total); return t===1?"Quick":t===2?"Moderate":"Long"; }
function fmtMin(m){ if(m<60) return m+" min"; const h=Math.floor(m/60), r=m%60; return r? h+"h "+r+"m" : h+"h"; }
function curServings(r){ return state.servingsOverride[r.id] || r.servings; }
function formatQty(n){
  if(n==null) return "";
  const whole = Math.floor(n+1e-6);
  const frac = n - whole;
  const map = [[0.125,"⅛"],[0.1667,"⅙"],[0.2,"⅕"],[0.25,"¼"],[0.333,"⅓"],[0.375,"⅜"],[0.4,"⅖"],
    [0.5,"½"],[0.6,"⅗"],[0.625,"⅝"],[0.667,"⅔"],[0.75,"¾"],[0.8,"⅘"],[0.833,"⅚"],[0.875,"⅞"]];
  if(frac<0.02) return String(whole);
  let best=null,bestd=1;
  for(const [v,s] of map){ const d=Math.abs(frac-v); if(d<bestd){bestd=d;best=s;} }
  if(bestd<0.035) return (whole>0? whole+"":"") + best;
  let val = Math.round(n*100)/100;
  return String(val);
}
function ingrLine(item, mult){
  if(item.a==null) return item.n.charAt(0).toUpperCase()+item.n.slice(1);
  const scaled = item.a*mult;
  const qty = formatQty(scaled);
  const bits = [qty, item.u, item.n].filter(Boolean);
  return bits.join(" ");
}
function cleanForPantry(name){
  return name.replace(/,\s*(to taste|optional|for garnish|for topping|for dusting|for frying|for serving|as desired|for brushing|for boiling water|for icing|for filling|for sauce|for dredge|divided|total).*$/i,"").trim();
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------------- PERSISTENCE ---------------- */
function newId(){ return "ex-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function docRef(uid){ return db.doc("users/"+uid+"/apps/bacon"); }
function applyCloudData(data){
  state.plan = (data && data.plan) || Object.fromEntries(DAYS.map(d=>[d,[]]));
  state.pantry = (data && data.pantry) || {};
  state.extras = (data && data.extras) || [];
  state.extras = state.extras.map(ex=> typeof ex === "string" ? {id:newId(), name:ex, section:grocerySection(ex)} : ex);
  state.groceryChecked = (data && data.groceryChecked) || {};
  state.servingsOverride = (data && data.servingsOverride) || {};
  state.itemLinks = (data && data.itemLinks) || {};
  state.customRecipes = (data && data.customRecipes) || [];
  state.catOverrides = (data && data.catOverrides) || {};
  rebuildRecipeMap();
}
function syncToCloud(){
  const user = auth.currentUser;
  if(!user) return;
  docRef(user.uid).set({
    plan: state.plan, pantry: state.pantry, extras: state.extras,
    groceryChecked: state.groceryChecked, servingsOverride: state.servingsOverride,
    customRecipes: state.customRecipes, catOverrides: state.catOverrides,
    itemLinks: state.itemLinks
  }, {merge:true}).catch(e=>console.error("sync failed", e));
}
let unsubscribeDoc = null;
function showApp(){
  document.getElementById("authgate").style.display = "none";

function showAuthGate(){
  document.getElementById("authgate").style.display = "";

}
auth.onAuthStateChanged(user=>{
  if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc = null; }
  if(user){
    unsubscribeDoc = docRef(user.uid).onSnapshot(snap=>{
      applyCloudData(snap.data());
      showApp();
    }, err=>console.error(err));
  } else {

  }
});

      <span class="servlabel">${cur} serving${cur===1?"":"s"}</span>
      <button data-servdelta="1" data-rid="${r.id}" data-base="${r.servings}">+</button>
      ${cur!==r.servings? `<span class="resetlink" data-servreset="${r.id}">reset to ${r.servings}</span>`:""}
    </div>
    <div class="ingr"><b>Ingredients:</b> ${r.ingr.map(i=>ingrLine(i,mult)).join(", ")}</div>
  </div>`;
}

function renderPlanner(){
  return `
    <p class="section-title">Weekly Planner</p>
    <p class="section-sub">Pick meals per day and set servings right when you add them. Each day totals its prep+cook time; chip color shows dish type.</p>
    <div class="week">
      ${DAYS.map(day=>{
        const entries = state.plan[day] || [];
        const totalTime = entries.reduce((s,e)=>{ const r=RECIPE_MAP[e.id]; return r? s+r.prep+r.cook : s; },0);
        return `
        <div class="day">
          <h4>${day}</h4>
          <div class="daytime">${entries.length? fmtMin(totalTime)+" total" : "no meals yet"}</div>
          ${entries.map((e,idx)=>{
            const r = RECIPE_MAP[e.id];
            if(!r) return "";
            return `<div class="chip" style="--chipcolor:${CATS[effectiveCat(r)].color}">
              <span class="chipname">${r.name}<span class="chipserv">${e.servings} serving${e.servings===1?"":"s"}</span></span>
              <span class="x" data-remove="${day}|${idx}">&times;</span>
            </div>`;
          }).join("")}
          <button class="addslot" data-openpicker="${day}">+ Add meal</button>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderPicker(){
  document.querySelectorAll(".overlay").forEach(el=>el.remove());
  const day = state.pickerFor;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const filtered = allRecipes().filter(r=> state.pickerCat==="all" || effectiveCat(r)===state.pickerCat);
  overlay.innerHTML = `
    <div class="modal">
      <h3>Add a meal &middot; ${day}</h3>
      <div class="filters">
        ${CAT_KEYS.map(c=>`<button data-pcatf="${c}" class="${state.pickerCat===c?"active":""}">${c==="all"?"All":CATS[c].label}</button>`).join("")}
      </div>
      <div class="picklist">
        ${filtered.map(r=>{
          const total = r.prep+r.cook;
          const chosen = state.pickerServ[r.id] || r.servings;
          return `<div class="pickitem">
            <div>
              <div class="pname">${r.name}</div>
              <div class="pmeta">${CATS[effectiveCat(r)].label} &middot; ${fmtMin(total)} &middot; base ${r.servings} servings</div>
            </div>
            <div class="pright">
              <div class="servctl" data-pickctl="${r.id}">
                <button data-pdelta="-1" data-rid="${r.id}">&minus;</button>
                <span class="servlabel">${chosen}</span>
                <button data-pdelta="1" data-rid="${r.id}">+</button>
              </div>
              <button class="addbtn" data-addmeal="${r.id}">Add</button>
            </div>
          </div>`;
        }).join("")}
      </div>
      <button class="closebtn" id="closepicker">Done</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.pickerFor=null; overlay.remove(); } };
  overlay.querySelector("#closepicker").onclick = ()=>{ state.pickerFor=null; overlay.remove(); };
  overlay.querySelectorAll("[data-pcatf]").forEach(b=>{
    b.onclick = ()=>{ state.pickerCat = b.dataset.pcatf; overlay.remove(); renderPicker(); };
  });
  overlay.querySelectorAll("[data-pdelta]").forEach(b=>{
    b.onclick = ()=>{
      const rid = b.dataset.rid;
      const r = RECIPE_MAP[rid];
      const cur = state.pickerServ[rid] || r.servings;
      const next = Math.max(1, cur + parseInt(b.dataset.pdelta,10));
      state.pickerServ[rid] = next;
      const label = b.closest(".servctl").querySelector(".servlabel");
      if(label) label.textContent = next;
    };
  });
  overlay.querySelectorAll("[data-addmeal]").forEach(b=>{
    b.onclick = ()=>{
      const rid = b.dataset.addmeal;
      const r = RECIPE_MAP[rid];
      const servings = state.pickerServ[rid] || r.servings;
      state.plan[day] = state.plan[day] || [];
      state.plan[day].push({id:rid, servings});
      state.pickerFor = null;
      syncToCloud();
      overlay.remove();
      render();
    };
  });
}

function allPantryNamesBySection(){
  const set = new Map();
  allRecipes().forEach(r=>r.ingr.forEach(i=>{
    const n = canonicalIngredient(i.n);
    if(n && !set.has(n.toLowerCase())) set.set(n.toLowerCase(), n);
  }));
  const bySection = {};
  set.forEach(name=>{
    const sec = grocerySection(name);
    (bySection[sec] = bySection[sec] || []).push(name);
  });
  Object.values(bySection).forEach(arr=>arr.sort((a,b)=>a.localeCompare(b)));
  return bySection;
}

function renderPantry(){
  const bySection = allPantryNamesBySection();
  return `
    <p class="section-title">Pantry</p>
    <p class="section-sub">Mark what's on hand, grouped the way your grocery aisles are &mdash; the Grocery List skips anything marked Have.</p>
    ${SECTION_ORDER.filter(s=>bySection[s]).map(sec=>{
      const col = SECTIONS[sec];
      return `<div class="secblock">
        <div class="sechead" style="background:${col.bg};color:${col.color}">${sec}</div>
        <div class="pantrylist">${bySection[sec].map(n=>pantryRow(n)).join("")}</div>
      </div>`;
    }).join("")}

    <div class="secblock" style="border-color:var(--plum);">
      <div class="sechead" style="background:var(--plum-bg);color:var(--plum)">Other Items &middot; not tied to a recipe</div>
      ${extraAddRow()}
      <div class="pantrylist">
        ${state.extras.length===0? `<div class="prow"><span style="color:var(--ink-soft);font-style:italic;">No extras added yet &mdash; chips, crackers, frozen fruit, snacks, anything else you need this week. Mark them Need when you're ready to buy them &mdash; they'll show up on your Grocery List.</span></div>` :
          state.extras.map((ex)=>{
            const st = state.pantry[ex.name.toLowerCase()] || "need";
            return `<div class="prow">
              <span>${ex.name} <span class="src" style="margin-left:6px;">${ex.section}</span></span>
              <div class="statusbtns" data-item="${ex.name}">
                <button class="have ${st==="have"?"on":""}" data-status="have">Have</button>
                <button class="low ${st==="low"?"on":""}" data-status="low">Low</button>
                <button class="need ${st==="need"?"on":""}" data-status="need">Need</button>
              </div>
              ${linkFieldHTML("extra:"+ex.id)}
              <span class="rmx" data-rmextra="${ex.id}">&times;</span>
            </div>`;
          }).join("")}
      </div>
    </div>
  `;
}
function pantryRow(n){
  const st = state.pantry[n.toLowerCase()] || "need";
  return `<div class="prow">
    <span>${n}</span>
    <div class="statusbtns" data-item="${n}">
      <button class="have ${st==="have"?"on":""}" data-status="have">Have</button>
      <button class="low ${st==="low"?"on":""}" data-status="low">Low</button>
      <button class="need ${st==="need"?"on":""}" data-status="need">Need</button>
    </div>
    ${linkFieldHTML("pantry:"+n)}
  </div>`;
}

function extraAddRow(){
  return `
  <div class="addrow">
    <input type="text" id="newextra" placeholder="Add something you need (sauces, frozen fruit, snacks...)">
    <select id="newextrasection">
      ${SECTION_ORDER.map(s=>`<option value="${s}">${s}</option>`).join("")}
    </select>
    <button id="addextrabtn">Add</button>
  </div>`;
}
function renderGrocery(){
  const hasAnyMeals = DAYS.some(d=> (state.plan[d]||[]).length>0);
  const hasExtras = state.extras.length>0;
  if(!hasAnyMeals && !hasExtras){
    return `
      <p class="section-title">Grocery List</p>
      <p class="section-sub">Built automatically from your Weekly Planner and anything marked Need in Pantry's Other Items.</p>
      <div class="empty">Nothing planned yet &mdash; add meals in the Planner tab, or add items in the Pantry tab and mark them Need.</div>
    `;
  }
  const agg = new Map();
  const flag = new Map();
  DAYS.forEach(day=>{
    (state.plan[day]||[]).forEach(entry=>{
      const r = RECIPE_MAP[entry.id];
      if(!r) return;
      const mult = entry.servings / r.servings;
      r.ingr.forEach(item=>{
        const cname = canonicalIngredient(item.n);
        if(item.a==null){
          const key = cname.toLowerCase();
          if(!flag.has(key)) flag.set(key,{name:cname, sources:new Set()});
          flag.get(key).sources.add(r.name);
        } else {
          const key = cname.toLowerCase()+"|"+item.u;
          if(!agg.has(key)) agg.set(key,{name:cname, unit:item.u, amt:0, sources:new Set()});
          const rec = agg.get(key);
          rec.amt += item.a*mult;
          rec.sources.add(r.name);
        }
      });
    });
  });
  const combined = [];
  agg.forEach(v=> combined.push({
    name: v.name, lookup: v.name.toLowerCase(),
    display: [formatQty(v.amt), v.unit, v.name].filter(Boolean).join(" "),
    sources: Array.from(v.sources)
  }));
  flag.forEach(v=> combined.push({
    name: v.name, lookup: v.name.toLowerCase(), display: v.name, sources: Array.from(v.sources)
  }));
  state.extras.forEach(ex=> combined.push({
    name: cap(ex.name), lookup: ex.name.toLowerCase(), display: cap(ex.name), sources: ["Weekly Extra"], section: ex.section
  }));
  const mealCombined = combined.filter(it=> !it.sources.includes("Weekly Extra"));
  const extraCombined = combined.filter(it=> it.sources.includes("Weekly Extra"));
  const mealNeed = mealCombined.filter(it=> (state.pantry[it.lookup]||"need") !== "have");
  const have = mealCombined.filter(it=> (state.pantry[it.lookup]||"need") === "have");
  const extraNeed = extraCombined.filter(it=> (state.pantry[it.lookup]||"need") === "need");

  const bySection = {};
  mealNeed.forEach(it=>{
    const sec = grocerySection(it.name);
    (bySection[sec] = bySection[sec] || []).push(it);
  });
  Object.values(bySection).forEach(arr=>arr.sort((a,b)=>a.name.localeCompare(b.name)));

  const byExtraSection = {};
  extraNeed.forEach(it=>{
    (byExtraSection[it.section] = byExtraSection[it.section] || []).push(it);
  });
  Object.values(byExtraSection).forEach(arr=>arr.sort((a,b)=>a.name.localeCompare(b.name)));

  const glistBlock = (it)=>{
    const checked = state.groceryChecked[it.lookup];
    return `<div class="grow ${checked?"done":""}">
      <input type="checkbox" data-gcheck="${it.lookup}" ${checked?"checked":""}/>
      <span>${it.display}</span>
      <span class="src">${it.sources.join(", ")}</span>
    </div>`;
  };

  return `
    <p class="section-title">Grocery List</p>
    <p class="section-sub">From this week's planned meals, at the servings you chose &middot; ${mealNeed.length} to pick up &middot; grouped like your store aisles</p>
    ${SECTION_ORDER.filter(s=>bySection[s]).map(sec=>{
      const col = SECTIONS[sec];
      return `<div class="secblock">
        <div class="sechead" style="background:${col.bg};color:${col.color}">${sec}</div>
        <div class="glist">${bySection[sec].map(glistBlock).join("")}</div>
      </div>`;
    }).join("")}
    ${mealNeed.length===0? `<div class="empty">No meals planned this week &mdash; add some in the Planner tab.</div>`:""}

    <p class="section-title" style="margin-top:28px;">Other Items</p>
    <p class="section-sub">Anything marked Need in Pantry's Other Items &mdash; add and manage them there. Marked Low or Have stays off this list.</p>
    ${SECTION_ORDER.filter(s=>byExtraSection[s]).map(sec=>{
      const col = SECTIONS[sec];
      return `<div class="secblock">
        <div class="sechead" style="background:${col.bg};color:${col.color}">${sec}</div>
        <div class="glist">
          ${byExtraSection[sec].map(it=>{
            const checked = state.groceryChecked[it.lookup];
            const ex = state.extras.find(e=>e.name.toLowerCase()===it.lookup);
            return `<div class="grow ${checked?"done":""}">
              <input type="checkbox" data-gcheck="${it.lookup}" ${checked?"checked":""}/>
              <span>${it.display}</span>
              ${ex? linkFieldHTML("extra:"+ex.id) : ""}
              ${ex? `<span class="rmx" data-rmextra="${ex.id}">&times;</span>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}
    ${extraNeed.length===0? `<div class="empty">Nothing marked Need yet &mdash; add and mark items in the Pantry tab.</div>`:""}

    ${have.length? `<div class="secblock havepanel" style="margin-top:28px;">
      <div class="sechead" style="background:var(--sage-bg);color:var(--sage)">Already in your pantry</div>
      <div class="glist">
        ${have.map(it=>`<div class="grow"><span class="tag-have">Have</span><span>${it.display}</span><span class="src">${it.sources.join(", ")}</span></div>`).join("")}
      </div>
    </div>`:""}
  `;
}

/* ---------------- EVENTS ---------------- */
function wireTabEvents(){
  const c = document.getElementById("tabcontent");
  c.querySelectorAll("[data-catf]").forEach(b=>{ b.onclick = ()=>{ state.catFilter=b.dataset.catf; render(); }; });

  const toggleAddRecipe = document.getElementById("toggleaddrecipe");
  if(toggleAddRecipe){
    toggleAddRecipe.onclick = ()=>{ state.addingRecipe = !state.addingRecipe; render(); };
  }
  const saveRecipeBtn = document.getElementById("saverecipebtn");
  if(saveRecipeBtn){
    saveRecipeBtn.onclick = ()=>{
      const name = document.getElementById("newrecipename").value.trim();
      if(!name) return;
      const cat = document.getElementById("newrecipecat").value;
      const servings = Math.max(1, parseInt(document.getElementById("newrecipeservings").value,10) || 1);
      const prep = Math.max(0, parseInt(document.getElementById("newrecipeprep").value,10) || 0);
      const cook = Math.max(0, parseInt(document.getElementById("newrecipecook").value,10) || 0);
      const lines = document.getElementById("newrecipeingr").value.split("\n").map(l=>l.trim()).filter(Boolean);
      const ingr = lines.map(parseIngredientLine).filter(Boolean);
      const id = "customrecipe-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      state.customRecipes.push({id, name, cat, servings, prep, cook, ingr});
      rebuildRecipeMap();
      syncToCloud();
      state.addingRecipe = false;
      render();
    };
  }
  c.querySelectorAll("[data-editcat]").forEach(el=>{
    el.onclick = ()=>{ state.editingRecipeCat[el.dataset.editcat] = true; render(); };
  });
  c.querySelectorAll("[data-catedit]").forEach(sel=>{
    sel.onchange = ()=>{
      const id = sel.dataset.catedit;
      state.catOverrides[id] = sel.value;
      delete state.editingRecipeCat[id];
      syncToCloud();
      render();
    };
  });

  c.querySelectorAll("[data-servdelta]").forEach(b=>{
    b.onclick = ()=>{
      const rid = b.dataset.rid;
      const base = parseInt(b.dataset.base,10);
      const cur = state.servingsOverride[rid] || base;
      const next = Math.max(1, cur + parseInt(b.dataset.servdelta,10));
      state.servingsOverride[rid] = next;
      syncToCloud();
      render();
    };
  });
  c.querySelectorAll("[data-servreset]").forEach(el=>{
    el.onclick = ()=>{ delete state.servingsOverride[el.dataset.servreset]; syncToCloud(); render(); };
  });

  c.querySelectorAll("[data-openpicker]").forEach(b=>{
    b.onclick = ()=>{ state.pickerFor=b.dataset.openpicker; state.pickerCat="all"; state.pickerServ={}; render(); };
  });
  c.querySelectorAll("[data-remove]").forEach(el=>{
    el.onclick = ()=>{
      const [day, idx] = el.dataset.remove.split("|");
      state.plan[day].splice(parseInt(idx,10),1);
      syncToCloud();
      render();
    };
  });

  c.querySelectorAll(".statusbtns").forEach(group=>{
    const item = group.dataset.item;
    group.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{
        state.pantry[item.toLowerCase()] = btn.dataset.status;
        syncToCloud();
        render();
      };
    });
  });
  const addExtraBtn = document.getElementById("addextrabtn");
  if(addExtraBtn){
    addExtraBtn.onclick = ()=>{
      const input = document.getElementById("newextra");
      const sectionSelect = document.getElementById("newextrasection");
      const val = input.value.trim();
      if(val){
        const section = sectionSelect ? sectionSelect.value : grocerySection(val);
        state.extras.push({id:newId(), name:val, section});
        syncToCloud();
        render();
      }
    };
  }
  c.querySelectorAll("[data-rmextra]").forEach(el=>{
    el.onclick = ()=>{
      state.extras = state.extras.filter(ex=>ex.id!==el.dataset.rmextra);
      syncToCloud();
      render();
    };
  });
  c.querySelectorAll("[data-link]").forEach(inp=>{
    inp.onchange = ()=>{
      setLink(inp.dataset.link, inp.value.trim());
      state.editingLink[inp.dataset.link] = false;
      syncToCloud();
      render();
    };
  });
  c.querySelectorAll("[data-editlink]").forEach(el=>{
    el.onclick = ()=>{
      state.editingLink[el.dataset.editlink] = true;
      render();
    };
  });

  c.querySelectorAll("[data-gcheck]").forEach(cb=>{
    cb.onchange = ()=>{
      state.groceryChecked[cb.dataset.gcheck] = cb.checked;
      syncToCloud();
    };
  });
}
</script>
</body>
</html>
